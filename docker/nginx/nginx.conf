server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    server_tokens off;

    # Tamaño máximo para subida de paquetes de hasta 500 XMLs y ZIPs
    client_max_body_size 120M;

    # Bloquear acceso a archivos ocultos (ej. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear acceso HTTP directo a carpetas sensibles y de soporte
    location ~ ^/(config|config_ohlala|sql|tests|logs|docker|secrets)/ {
        deny all;
        return 404;
    }

    # Bloquear extensiones de configuración, respaldos y scripts
    location ~* \.(sql|log|ini|env|bak|backup|old|zip|yml|yaml|toml|conf|config|mjs|sh|bat)$ {
        deny all;
        return 404;
    }

    # Servir archivos estáticos directamente
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Ruta principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de scripts PHP mediante FastCGI hacia elebensat_app
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass elebensat_app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts extendidos para procesos masivos del SAT y reportes complejos
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;

        # Buffers optimizados para respuestas JSON extensas y DataTables
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }
}
