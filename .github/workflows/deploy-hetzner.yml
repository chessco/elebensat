name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/5] Actualizando repositorio en Hetzner..."
            cd /opt/pitaya/elebensat
            git pull origin main

            echo "🔨 [2/5] Compilando imágenes Docker actualizadas..."
            docker compose build elebensat_app elebensat_web

            echo "🔄 [3/5] Levantando stack ELEBENSAT (elebensat_net)..."
            docker compose up -d

            echo "🩺 [4/5] Verificando estado de contenedores y salud HTTP..."
            docker compose ps
            sleep 3
            curl -I --fail http://127.0.0.1:8080/login.php || echo "⚠️ Advertencia en comprobación HTTP inicial"

            echo "🧹 [5/5] Limpiando imágenes huérfanas..."
            docker image prune -f

            echo "✅ Despliegue de ELEBENSAT en Hetzner finalizado exitosamente."
