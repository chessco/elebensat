name: CI/CD & Deploy to Hetzner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test_and_audit:
    name: 🛡️ Pre-Deployment Security & Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, zip, pdo, pdo_mysql, simplexml, dom
          ini-values: short_open_tag=Off, session.cookie_httponly=1, session.cookie_samesite=Lax, session.use_strict_mode=1, display_errors=Off

      - name: 🔍 PHP Syntax Verification (php -l)
        run: |
          echo "Verificando sintaxis PHP en el 100% de los archivos del proyecto..."
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors" && exit 1 || echo "✔ Todos los archivos PHP tienen sintaxis válida."

      - name: 🧪 Run Automated Security & Logic Testbed
        run: |
          echo "Ejecutando suite de pruebas de seguridad y auditoría..."
          php tests/suite_seguridad.php

  deploy:
    name: 🚀 Deploy to Hetzner Production
    needs: test_and_audit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/6] Verificando repositorio en /opt/pitaya/elebensat..."
            cd /opt/pitaya
            if [ ! -d "elebensat/.git" ]; then
              echo "📦 Repositorio no encontrado. Clonando por primera vez..."
              git clone https://github.com/chessco/elebensat.git || git clone git@github.com:chessco/elebensat.git
            fi

            cd /opt/pitaya/elebensat
            git pull origin main

            # Preparar .env y database.php desde plantillas si no existen en el servidor
            if [ ! -f ".env" ]; then
              echo "⚙️ Creando .env inicial desde .env.example..."
              cp .env.example .env
            fi

            if [ ! -f "docker/config_ohlala/database.php" ]; then
              echo "⚙️ Creando database.php inicial desde plantilla..."
              mkdir -p docker/config_ohlala
              cp docker/config_ohlala/database.php.example docker/config_ohlala/database.php
            fi

            echo "🔨 [2/6] Compilando imágenes Docker de ELEBENSAT..."
            docker compose build elebensat_app elebensat_web

            echo "🔄 [3/6] Levantando stack independiente (elebensat_net)..."
            docker compose up -d

            echo "🩺 [4/6] Verificando estado y salud HTTP..."
            docker compose ps
            sleep 3
            curl -I --fail http://127.0.0.1:8080/login.php || echo "⚠️ Advertencia en verificación HTTP local"

            echo "🧪 [5/6] Ejecutando cama de pruebas en vivo sobre producción..."
            docker exec elebensat_app php /var/www/html/tests/suite_seguridad.php

            echo "🧹 [6/6] Limpiando imágenes huérfanas..."
            docker image prune -f

            echo "✅ Despliegue de ELEBENSAT en Hetzner finalizado exitosamente."
