services:
  elebensat_web:
    container_name: elebensat_web
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ELEBENSAT_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - elebensat_app
    networks:
      - elebensat_net

  elebensat_app:
    container_name: elebensat_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SGKSAT_BASE_DIR=/var/data/sgksat
      - SGKSAT_CONFIG_FILE=/var/www/config_ohlala/database.php
      - SGKSAT_SECRET_KEY=${SGKSAT_SECRET_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./:/var/www/html
      - ./docker/config_ohlala/database.php:/var/www/config_ohlala/database.php:ro
      - elebensat_storage:/var/data/sgksat
    depends_on:
      elebensat_db:
        condition: service_started
    networks:
      - elebensat_net

  elebensat_db:
    container_name: elebensat_db
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=128M
      --sql_mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - elebensat_db_data:/var/lib/mysql
      - ./sql/visor.sql:/docker-entrypoint-initdb.d/01_visor.sql:ro
    networks:
      - elebensat_net

networks:
  elebensat_net:
    name: elebensat_net
    driver: bridge

volumes:
  elebensat_storage:
    name: elebensat_storage
  elebensat_db_data:
    name: elebensat_db_data
